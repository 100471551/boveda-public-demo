name: Deployment checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run demo:validate
      - run: npm run test:deploy
      - run: npm run build:demo
      - name: Validate built artefacts
        run: node demo-v2/scripts/validate.mjs
